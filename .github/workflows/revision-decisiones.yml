# Cada día marca en decisiones.csv las decisiones cuya fecha de revisión llegó
# con "revision pendiente". Solo corre desde la rama principal.
name: Revisión de decisiones

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marcar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Marcar decisiones vencidas
        run: python3 scripts/decisiones.py check

      - name: Guardar cambios
        run: |
          if ! git diff --quiet decisiones.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add decisiones.csv
            git commit -m "Decisiones: marcar revisiones pendientes"
            git push
          fi
